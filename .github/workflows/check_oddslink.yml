name: OddsLink Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Check OddsLink coverage
        env:
          ODDSLINK_API_KEY: ${{ secrets.ODDSLINK_API_KEY }}
        run: python check_oddslink.py
