name: EV Odds Scanner

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: csv-writer
  cancel-in-progress: false

jobs:
  scan-odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Run Scanner
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scanner.py

      - name: Commit and Push CSV Log
        run: |
          git config --global user.name "EV-Scanner-Bot"
          git config --global user.email "bot@example.com"

          if [ -f ev_plays_log.csv ]; then
            git add ev_plays_log.csv
            if ! git diff --quiet --cached; then
              git commit -m "Auto-log new EV plays"
              git pull origin main --rebase
              git push
            fi
          else
            echo "No edges found. CSV was not created, skipping commit."
          fi
